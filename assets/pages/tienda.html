<!DOCTYPE html>
<html lang="es-ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda Mcg</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../styles/styles.css">
<link rel="shortcut icon" href="../img/icotienda.jpg" type="image/x-icon">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- Opcional: Font Awesome para icono más profesional -->
<script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>

<header>
    <nav>
        <h1>Tienda</h1>
        <a href="../../index.html">
            <img src="../img/logo indumentaria.jpg" alt="Home" title="Volver al inicio" class="mcg">
        </a>
        <ul>
            <li><a href="./ofertasdelmes.html" class="menu">Ofertas</a></li>
            <li><a href="./contacto.html" class="menu">Contacto</a></li>
            <li><a href="./sobre-nosotros.html" class="menu">Nosotros</a></li>
        </ul>
    </nav>
</header>

<main>
    <ul class="ul">
        <li>
            <img src="../img/buzos.jpeg" alt="Buzos" title="Buzos" class="logo">
            <p id="id">Buzos</p>
            <span class="precio" id="precio1">$15000 (Stock: 15)</span>
            <button class="comprar-btn" data-id="1">Comprar</button>
            <span class="mensaje" id="mensaje1"></span>
        </li>
        <li>
            <img src="../img/calzado.jpeg" alt="Calzados" title="Calzados" class="logo">
            <p id="id">Calzados</p>
            <span class="precio" id="precio2">$30000 (Stock: 10)</span>
            <button class="comprar-btn" data-id="2">Comprar</button>
            <span class="mensaje" id="mensaje2"></span>
        </li>
        <li>
            <img src="../img/pantalones.jpg" alt="Pantalones" title="Pantalones" class="logo">
            <p id="id">Pantalones</p>
            <span class="precio" id="precio3">$40000 (Stock: 13)</span>
            <button class="comprar-btn" data-id="3">Comprar</button>
            <span class="mensaje" id="mensaje3"></span>
        </li>
        <li>
            <img src="../img/remera.jpeg" alt="Remeras" title="Remeras" class="logo">
            <p id="id">Remeras</p>
            <span class="precio" id="precio4">$12000 (Stock: 20)</span>
            <button class="comprar-btn" data-id="4">Comprar</button>
            <span class="mensaje" id="mensaje4"></span>
        </li>
    </ul>

    <section>
        <h3>🛒 Carrito de compras</h3>
        <ul id="carrito" class="ul"></ul>
        <h4>Total: $<span id="total">0</span></h4>
        <button id="vaciar-carrito"><i class="fas fa-trash-alt"></i> Vaciar carrito</button>
    </section>
</main>

<footer>
    <a href="https://instagram.com"><img src="../img/instagram logo.webp" class="foot" alt="Instagram" title="Instagram"></a>
    <a href="https://facebook.com"><img src="../img/facebook logo.png" class="foot" alt="Facebook" title="Facebook"></a>
    <a href="https://pinterest.com"><img src="../img/Pinterest-logo.png" class="foot" alt="Pinterest" title="Pinterest"></a>
    <a href="https://whatsapp.com"><img src="../img/whatsapp.webp" class="wp" alt="Whatsapp" title="Whatsapp"></a>
    <p>Mcg Indumentarias Todos los derechos reservados</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../assets/styles/js/carrito.js"></script>
</body>
</html>
